<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡Feliz cumpleaños! 🎉</title>
  <meta name="description" content="Tienes un regalo esperando. Ábrelo y descubre la sorpresa." />
  <meta name="theme-color" content="#1b0f3a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
  <script>
    // Permite forzar los efectos completos con ?motion=1
    // aunque el sistema tenga activado "reducir movimiento".
    try {
      if (new URLSearchParams(window.location.search).get("motion") === "1") {
        document.documentElement.classList.add("force-motion");
      }
    } catch (error) {
      /* Sin problema: se mantienen las preferencias del sistema. */
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="balloons" id="balloons" aria-hidden="true"></div>

  <main class="stage">
    <section class="intro" id="intro">
      <p class="eyebrow">✨ Hay algo para ti ✨</p>

      <button class="gift" id="gift" type="button">
        <span class="gift__art">
          <svg viewBox="0 0 260 280" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff8bbb" />
                <stop offset="0.55" stop-color="#ff4f93" />
                <stop offset="1" stop-color="#dc2f70" />
              </linearGradient>
              <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffa6cc" />
                <stop offset="1" stop-color="#f4518d" />
              </linearGradient>
              <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffe394" />
                <stop offset="1" stop-color="#ffb703" />
              </linearGradient>
            </defs>

            <ellipse cx="130" cy="259" rx="95" ry="14" fill="rgba(10, 3, 28, 0.45)" />
            <ellipse cx="130" cy="256" rx="68" ry="9" fill="rgba(255, 94, 156, 0.18)" />

            <!-- Caja -->
            <rect x="45" y="136" width="170" height="112" rx="13" fill="url(#box)" />
            <rect x="45" y="136" width="170" height="112" rx="13" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" />
            <rect x="112" y="136" width="36" height="112" fill="url(#ribbon)" />
            <rect x="112" y="136" width="8" height="112" fill="rgba(255,255,255,0.25)" />
            <path d="M58 152c22-8 40-9 50-8" stroke="rgba(255,255,255,0.35)" stroke-width="6" stroke-linecap="round" fill="none" />

            <!-- Tapa con lazo -->
            <g id="lid">
              <path d="M130 100C112 66 80 62 84 88c3 18 26 20 46 12Z" fill="url(#ribbon)" stroke="#dd9700" stroke-width="2.5" stroke-linejoin="round" />
              <path d="M130 100c18-34 50-38 46-12-3 18-26 20-46 12Z" fill="url(#ribbon)" stroke="#dd9700" stroke-width="2.5" stroke-linejoin="round" />
              <path d="M124 110c-10 19-20 30-31 36" stroke="url(#ribbon)" stroke-width="12" stroke-linecap="round" fill="none" />
              <path d="M136 110c10 19 20 30 31 36" stroke="url(#ribbon)" stroke-width="12" stroke-linecap="round" fill="none" />
              <rect x="28" y="96" width="204" height="44" rx="12" fill="url(#lid)" />
              <rect x="28" y="96" width="204" height="44" rx="12" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
              <rect x="28" y="118" width="204" height="22" rx="10" fill="rgba(151, 20, 71, 0.22)" />
              <rect x="112" y="96" width="36" height="44" fill="url(#ribbon)" />
              <rect x="112" y="96" width="8" height="44" fill="rgba(255,255,255,0.3)" />
              <circle cx="130" cy="99" r="15" fill="#ffd166" stroke="#dd9700" stroke-width="2.5" />
            </g>

            <!-- Brillos -->
            <g class="sparkles" fill="#ffe9a8">
              <path class="sparkle" d="M34 72l4.5 9.5L48 86l-9.5 4.5L34 100l-4.5-9.5L20 86l9.5-4.5Z" />
              <path class="sparkle sparkle--2" d="M222 48l3.4 7.1 7.1 3.4-7.1 3.4-3.4 7.1-3.4-7.1-7.1-3.4 7.1-3.4Z" />
              <circle class="sparkle sparkle--3" cx="216" cy="146" r="4" />
              <circle class="sparkle sparkle--4" cx="44" cy="182" r="3" />
            </g>
          </svg>
        </span>
        <span class="gift__cta">Ábreme 🎁</span>
      </button>

      <p class="hint">Toca el regalo para descubrir la sorpresa</p>
    </section>

    <section class="card" id="message" aria-live="polite" hidden>
      <p class="card__eyebrow">🎉 Hoy es tu día 🎉</p>
      <h1 class="card__title" id="card-title" tabindex="-1">¡Feliz<br />Cumpleaños!</h1>
      <p class="card__name" id="card-name"></p>
      <p class="card__text" id="card-text">Que este día esté lleno de risas, sorpresas y mucho pastel. ¡Que se cumplan todos tus deseos!</p>
      <p class="card__sign" id="card-sign">Con cariño ❤️</p>
      <button class="again" id="again" type="button">¡Otra vez! 🎈</button>
    </section>
  </main>

  <button class="sound" id="sound" type="button" aria-label="Silenciar música" aria-pressed="true" title="Silenciar música">
    <svg class="sound__on" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor" />
      <path d="M16 8.5a5 5 0 0 1 0 7M18.7 6a8.7 8.7 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
    <svg class="sound__off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M4 9v6h4l5 4V5L8 9H4Z" fill="currentColor" />
      <path d="m16 9 5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>

  <noscript>
    <p class="noscript">Activa JavaScript para abrir la sorpresa 🎁</p>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
